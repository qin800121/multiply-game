<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C5CE7">
<title>九九乘法大冒险</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236C5CE7'/><text x='50' y='72' font-size='64' font-weight='bold' text-anchor='middle' fill='white'>×</text></svg>">
<style>
:root{
  --purple:#6C5CE7; --purple-d:#5546c9;
  --pink:#FF6B9D; --orange:#FFA94D; --yellow:#FFD43B;
  --green:#22B573; --red:#FF4757;
  --ink:#2D2A45; --ink2:#6E6A8F; --line:#EDEAF7;
  --bg:#F7F5FF; --card:#FFFFFF;
  --sh:0 6px 22px rgba(108,92,231,.10);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink);
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
#app{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;overflow:hidden;}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(var(--safe-b) + 10px);
  opacity:0;visibility:hidden;transform:translateX(30px);
  transition:opacity .26s ease,transform .26s ease,visibility .26s;
  background:var(--bg);overflow:hidden;
}
.screen.active{opacity:1;visibility:visible;transform:none;}

/* ---------- 通用按钮 ---------- */
.btn{
  border:none;font-family:inherit;font-weight:800;color:#fff;
  border-radius:18px;cursor:pointer;font-size:17px;
  background:linear-gradient(180deg,#7C6CF5,#6C5CE7);
  box-shadow:0 6px 0 #5546c9,0 10px 22px rgba(108,92,231,.32);
  padding:16px;transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5546c9,0 4px 12px rgba(108,92,231,.3);}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:0 6px 0 #E4E0F7,0 8px 18px rgba(108,92,231,.12);}
.btn.ghost:active{box-shadow:0 2px 0 #E4E0F7;}
.btn.pink{background:linear-gradient(180deg,#FF85AF,#FF6B9D);box-shadow:0 6px 0 #E04E80,0 10px 22px rgba(255,107,157,.3);}
.btn.pink:active{box-shadow:0 2px 0 #E04E80;}
.btn.wide{width:100%;}

/* ---------- 首页 ---------- */
.home-head{text-align:center;padding:14px 0 6px;}
.logo{
  display:inline-flex;align-items:center;justify-content:center;
  width:74px;height:74px;border-radius:24px;
  background:linear-gradient(140deg,#8B7CFF,#6C5CE7 60%,#5A4BD1);
  color:#fff;font-size:34px;font-weight:900;
  box-shadow:0 12px 26px rgba(108,92,231,.34);
  animation:floaty 3s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.title{font-size:27px;font-weight:900;margin-top:12px;letter-spacing:.5px;}
.title em{
  font-style:normal;
  background:linear-gradient(90deg,#FF6B9D,#FFA94D,#6C5CE7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{font-size:13px;color:var(--ink2);margin-top:6px;letter-spacing:.4px;}

.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-top:14px;}
.panel-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:12px;}
.panel-h .dot{width:7px;height:7px;border-radius:50%;background:var(--purple);}
.panel-h .hint{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink2);}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.chip{
  border:2px solid var(--line);background:#FAF9FF;border-radius:15px;
  padding:11px 4px;text-align:center;cursor:pointer;transition:.16s;
}
.chip .n{font-size:19px;font-weight:900;color:var(--ink);line-height:1.15;}
.chip .u{font-size:10px;color:var(--ink2);font-weight:600;margin-top:2px;}
.chip.on{background:linear-gradient(180deg,#7C6CF5,#6C5CE7);border-color:var(--purple);transform:translateY(-2px);box-shadow:0 6px 14px rgba(108,92,231,.32);}
.chip.on .n,.chip.on .u{color:#fff;}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.seg2{grid-template-columns:repeat(2,1fr);}
.seg-item{
  border:2px solid var(--line);background:#FAF9FF;border-radius:15px;padding:12px 6px;
  text-align:center;cursor:pointer;transition:.16s;font-weight:800;font-size:15px;
}
.seg-item small{display:block;font-size:10px;font-weight:600;color:var(--ink2);margin-top:3px;}
.seg-item.on{background:linear-gradient(180deg,#7C6CF5,#6C5CE7);border-color:var(--purple);color:#fff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(108,92,231,.32);}
.seg-item.on small{color:rgba(255,255,255,.8);}

.preview{margin-top:14px;text-align:center;font-size:13px;color:var(--ink2);font-weight:600;}
.preview b{color:var(--purple);font-size:15px;}

.home-foot{
  margin-top:auto;display:flex;gap:10px;padding-top:12px;
}
.home-foot .btn{flex:1;font-size:16px;padding:15px;}

/* 最近成绩条 */
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.recent::-webkit-scrollbar{display:none}
.rc{
  flex:0 0 auto;background:#FAF9FF;border:2px solid var(--line);border-radius:14px;
  padding:8px 12px;font-size:11px;color:var(--ink2);font-weight:700;text-align:center;min-width:74px;
}
.rc b{display:block;font-size:15px;color:var(--purple);margin-bottom:2px;}
.empty-tip{font-size:12px;color:#B4AFCC;text-align:center;padding:10px 0;font-weight:600;}

/* ---------- 做题页 ---------- */
.q-top{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:13px;border:none;background:#fff;
  box-shadow:0 3px 10px rgba(108,92,231,.14);font-size:16px;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:active{transform:scale(.94)}
.progress-wrap{flex:1;height:12px;border-radius:8px;background:#E9E5FA;overflow:hidden;position:relative;}
.progress-bar{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#8B7CFF,#FF6B9D);transition:width .3s;}
.q-count{font-size:12px;font-weight:800;color:var(--ink2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
.timer{
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:14px;font-weight:900;color:var(--purple);
  background:#EFEBFF;border-radius:12px;padding:7px 11px;font-variant-numeric:tabular-nums;
}
.timer.warn{color:#fff;background:var(--red);animation:pulse .9s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.timer.hide{display:none;}

.q-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;position:relative;
}
.q-card{
  width:100%;background:#fff;border-radius:26px;box-shadow:var(--sh);
  padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;overflow:hidden;
}
.q-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,rgba(108,92,231,.09),transparent 62%);pointer-events:none;}
.q-num{font-size:12px;font-weight:800;color:#B9B3D6;letter-spacing:1px;}
.q-expr{
  font-size:46px;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:10px;
  font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;
}
.q-expr .ans{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:104px;height:62px;border-radius:16px;border:3px dashed #D7D0F0;
  background:#FAF8FF;padding:0 8px;font-size:44px;color:var(--purple);transition:.18s;
}
.q-expr .ans.filled{border-style:solid;border-color:var(--purple);background:#F1EDFF;}
.q-expr .ans.wrong{border-color:var(--red);background:#FFEFEF;color:var(--red);}
.q-expr .ans.right{border-color:var(--green);background:#EBFAF2;color:var(--green);}
.q-expr .ans.shake{animation:shake .34s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.correct-line{font-size:14px;font-weight:800;color:var(--red);height:20px;opacity:0;transition:.2s;}
.correct-line.show{opacity:1;}

/* 键盘 */
.pad{
  width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.pad .key{
  height:58px;border-radius:17px;border:none;background:#fff;
  font-family:inherit;font-size:24px;font-weight:800;color:var(--ink);
  box-shadow:0 4px 0 #E2DDF4,0 6px 14px rgba(108,92,231,.09);
  cursor:pointer;transition:transform .07s,box-shadow .07s;
  display:flex;align-items:center;justify-content:center;
}
.pad .key:active{transform:translateY(4px);box-shadow:0 0 0 #E2DDF4;}
.pad .key.del{background:#FFF1F1;color:var(--red);box-shadow:0 4px 0 #FBD9D9;}
.pad .key.del:active{box-shadow:0 0 0 #FBD9D9;}
.pad .key.ok{
  background:linear-gradient(180deg,#7C6CF5,#6C5CE7);color:#fff;font-size:19px;
  box-shadow:0 4px 0 #5546c9;letter-spacing:1px;
}
.pad .key.ok:active{box-shadow:0 0 0 #5546c9;}

/* 飘星 */
.star-fly{
  position:absolute;left:50%;top:44%;font-size:52px;pointer-events:none;
  z-index:60;animation:starfly .95s ease-out forwards;
}
@keyframes starfly{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.35) rotate(12deg);opacity:1}
  100%{transform:translate(-50%,-190%) scale(.7) rotate(-16deg);opacity:0}
}

/* ---------- 结算页 ---------- */
.result-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
.result-hero{text-align:center;padding:12px 0 4px;}
.big-star{font-size:64px;animation:pop .6s cubic-bezier(.2,1.4,.5,1);display:inline-block;}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.22) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.result-title{font-size:22px;font-weight:900;margin-top:8px;}
.result-sub{font-size:13px;color:var(--ink2);margin-top:5px;font-weight:600;}
.star-row{display:flex;justify-content:center;gap:6px;font-size:30px;margin-top:10px;}
.star-row span{filter:grayscale(1);opacity:.3;transition:.3s;}
.star-row span.on{filter:none;opacity:1;animation:pop .5s cubic-bezier(.2,1.4,.5,1) both;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.stat{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--sh);}
.stat .v{font-size:21px;font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums;}
.stat .k{font-size:11px;color:var(--ink2);font-weight:700;margin-top:3px;}
.stat.g .v{color:var(--green)} .stat.r .v{color:var(--red)}

.wrong-list{margin-top:14px;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--sh);}
.wrong-list h4{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.wrong-list h4 .tag{font-size:10px;background:#FFEFEF;color:var(--red);padding:2px 7px;border-radius:8px;font-weight:800;}
.wrong-item{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;
  background:#FFF7F7;margin-bottom:7px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;
}
.wrong-item .x{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px;opacity:.85;}
.wrong-item .ok{color:var(--green);}
.wrong-item .arrow{color:#C9C3E4;font-size:12px;}

.result-foot{display:flex;flex-direction:column;gap:9px;padding-top:12px;}
.result-foot .row{display:flex;gap:9px;}
.result-foot .row .btn{flex:1;font-size:15px;padding:14px;}

/* 历史页 */
.hist-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:10px;}
.hist-item{
  background:#fff;border-radius:18px;padding:13px 15px;box-shadow:var(--sh);margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.hist-badge{
  width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;
  font-variant-numeric:tabular-nums;
}
.hist-badge small{font-size:8px;font-weight:700;opacity:.85;}
.hist-info{flex:1;min-width:0;}
.hist-info .l1{font-size:14px;font-weight:800;margin-bottom:3px;}
.hist-info .l2{font-size:11px;color:var(--ink2);font-weight:600;}
.page-head{display:flex;align-items:center;gap:10px;padding:4px 0 2px;}
.page-head h2{font-size:19px;font-weight:900;}
.page-head .spacer{flex:1;}
.clear-btn{font-size:12px;font-weight:800;color:var(--red);background:#FFF0F0;border:none;border-radius:11px;padding:8px 12px;}

/* 覆盖层 */
.overlay{
  position:absolute;inset:0;background:rgba(45,42,69,.55);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:100;opacity:0;visibility:hidden;transition:.22s;
}
.overlay.show{opacity:1;visibility:visible;}
.dialog{
  background:#fff;border-radius:24px;padding:22px 20px;width:100%;max-width:320px;text-align:center;
  transform:scale(.9);transition:.24s cubic-bezier(.2,1.3,.5,1);
}
.overlay.show .dialog{transform:scale(1);}
.dialog .em{font-size:44px;}
.dialog h3{font-size:18px;font-weight:900;margin-top:8px;}
.dialog p{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.6;font-weight:600;}
.dialog .acts{display:flex;gap:9px;margin-top:18px;}
.dialog .acts .btn{flex:1;font-size:15px;padding:13px;}

/* 星星粒子 */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:90;}

/* 顶部提示 */
.toast{
  position:absolute;left:50%;top:64px;transform:translate(-50%,-14px);
  background:rgba(45,42,69,.93);color:#fff;font-size:13px;font-weight:700;
  padding:10px 18px;border-radius:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (max-height:640px){
  .q-expr{font-size:38px;} .q-expr .ans{height:52px;min-width:90px;font-size:36px;}
  .pad .key{height:50px;font-size:21px;} .logo{width:62px;height:62px;font-size:28px;}
  .title{font-size:23px;} .panel{padding:13px;margin-top:10px;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ========== 首页 ========== -->
  <section class="screen active" id="screen-home">
    <div class="home-head">
      <div class="logo">×</div>
      <div class="title">九九<em>乘法大冒险</em></div>
      <div class="subtitle">选好题量，开始挑战吧！</div>
    </div>

    <div class="panel">
      <div class="panel-h"><span class="dot"></span>题目数量<span class="hint" id="hintRange">1×1 ~ 9×9</span></div>
      <div class="chips" id="chipsCount"></div>
    </div>

    <div class="panel" style="padding:13px 16px;">
      <div class="panel-h" style="margin-bottom:10px;"><span class="dot" style="background:var(--pink)"></span>练习范围</div>
      <div class="seg seg2" id="segRange">
        <div class="seg-item on" data-range="all">全部<small>1~9 × 1~9</small></div>
        <div class="seg-item" data-range="easy">入门<small>1~5 × 1~5</small></div>
        <div class="seg-item" data-range="mid">进阶<small>6~9 × 6~9</small></div>
        <div class="seg-item" data-range="table">单表<small>指定乘数</small></div>
      </div>
      <div class="chips" id="chipsTable" style="grid-template-columns:repeat(9,1fr);gap:5px;margin-top:12px;display:none;"></div>
    </div>

    <div class="panel" style="padding:13px 16px;">
      <div class="panel-h" style="margin-bottom:10px;"><span class="dot" style="background:var(--orange)"></span>计时方式</div>
      <div class="seg" id="segMode">
        <div class="seg-item on" data-mode="countup">正计时<small>记录用时</small></div>
        <div class="seg-item" data-mode="countdown">倒计时<small>限时挑战</small></div>
        <div class="seg-item" data-mode="none">不计时<small>轻松练</small></div>
      </div>
      <div class="seg" id="segLimit" style="grid-template-columns:repeat(4,1fr);margin-top:10px;display:none;">
        <div class="seg-item" data-limit="60">1分钟</div>
        <div class="seg-item" data-limit="120">2分钟</div>
        <div class="seg-item on" data-limit="180">3分钟</div>
        <div class="seg-item" data-limit="300">5分钟</div>
      </div>
    </div>

    <div class="panel" style="padding:13px 16px;">
      <div class="panel-h" style="margin-bottom:10px;"><span class="dot" style="background:var(--green)"></span>最近成绩</div>
      <div class="recent" id="recentList"><div class="empty-tip" style="width:100%">还没有记录，开始第一次练习吧 ~</div></div>
    </div>

    <div class="home-foot">
      <button class="btn ghost" id="btnHistory" style="flex:0 0 100px;font-size:14px;padding:15px 0;">📋 历史</button>
      <button class="btn" id="btnStart">开始挑战 🚀</button>
    </div>
  </section>

  <!-- ========== 做题页 ========== -->
  <section class="screen" id="screen-quiz">
    <div class="q-top">
      <button class="icon-btn" id="btnQuit">✕</button>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="q-count" id="qCount">0/20</div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:10px;">
      <div class="timer" id="timerBox">⏱ <span id="timerText">0:00</span></div>
    </div>

    <div class="q-main" id="qMain">
      <div class="q-card">
        <div class="q-num" id="qNum">第 1 题</div>
        <div class="q-expr">
          <span id="qA">1</span><span>×</span><span id="qB">1</span><span>=</span>
          <span class="ans" id="qAns"></span>
        </div>
        <div class="correct-line" id="correctLine"></div>
      </div>
    </div>

    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key del" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key ok" data-k="ok">确定</button>
    </div>
  </section>

  <!-- ========== 结算页 ========== -->
  <section class="screen" id="screen-result">
    <div class="result-wrap">
      <div class="result-hero">
        <div class="big-star" id="rHero">🏆</div>
        <div class="result-title" id="rTitle">太棒了！</div>
        <div class="result-sub" id="rSub"></div>
        <div class="star-row" id="rStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="v" id="rTotal">0</div><div class="k">题目数</div></div>
        <div class="stat g"><div class="v" id="rRight">0</div><div class="k">答对</div></div>
        <div class="stat r"><div class="v" id="rWrong">0</div><div class="k">答错</div></div>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px;">
        <div class="stat"><div class="v" id="rRate">0%</div><div class="k">正确率</div></div>
        <div class="stat"><div class="v" id="rTime">0s</div><div class="k">总用时</div></div>
        <div class="stat"><div class="v" id="rAvg">0s</div><div class="k">平均每题</div></div>
      </div>

      <div class="wrong-list" id="wrongList" style="display:none;">
        <h4>❌ 错题回顾 <span class="tag" id="wrongTag">0 题</span></h4>
        <div id="wrongItems"></div>
      </div>
    </div>

    <div class="result-foot">
      <button class="btn pink wide" id="btnRedoWrong" style="display:none;">🔁 错题重做（<span id="redoN">0</span> 题）</button>
      <div class="row">
        <button class="btn ghost" id="btnAgain" style="flex:1">再来一次</button>
        <button class="btn" id="btnBackHome" style="flex:1">回到首页</button>
      </div>
    </div>
  </section>

  <!-- ========== 历史页 ========== -->
  <section class="screen" id="screen-history">
    <div class="page-head">
      <button class="icon-btn" id="btnHistBack">←</button>
      <h2>练习记录</h2>
      <div class="spacer"></div>
      <button class="clear-btn" id="btnHistClear">清空</button>
    </div>
    <div class="hist-wrap" id="histList"></div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>

  <!-- 退出确认 -->
  <div class="overlay" id="ovQuit">
    <div class="dialog">
      <div class="em">🤔</div>
      <h3>要退出本次练习吗？</h3>
      <p>当前进度会丢失，已完成的部分不会保存哦</p>
      <div class="acts">
        <button class="btn ghost" id="ovQuitNo">继续做</button>
        <button class="btn pink" id="ovQuitYes">退出</button>
      </div>
    </div>
  </div>

  <!-- 时间到 -->
  <div class="overlay" id="ovTimeout">
    <div class="dialog">
      <div class="em">⏰</div>
      <h3>时间到啦！</h3>
      <p id="ovTimeoutTxt">来看看你的成绩吧</p>
      <div class="acts">
        <button class="btn wide" id="ovTimeoutOk">查看成绩</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random()*n);

/* ============ 本地存储 ============ */
const LS_KEY = 'mult_game_history_v1';
const LS_CFG = 'mult_game_cfg_v1';
const Store = {
  read(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch(e){ return []; } },
  write(list){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0,50))); }catch(e){}
  },
  add(rec){
    const list = this.read(); list.unshift(rec); this.write(list);
  },
  clear(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} },
  saveCfg(cfg){ try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){} },
  loadCfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG)||'null'); }catch(e){ return null; } }
};

/* ============ 状态 ============ */
const cfg = { count:20, range:'all', table:5, mode:'countup', limit:180 };
const saved = Store.loadCfg();
if(saved) Object.assign(cfg, saved);

const S = {
  questions:[], idx:0, input:'', answers:[], // {a,b,val,correct,t}
  startAt:0, endAt:0, elapsed:0, timerId:null, locked:false,
  isRedo:false, redoPool:[], timeoutFlag:false
};

/* ============ 出题 ============ */
function buildPool(){
  const pool = [];
  let lo1=1,hi1=9,lo2=1,hi2=9;
  if(cfg.range==='easy'){ lo1=1;hi1=5; lo2=1;hi2=5; }
  else if(cfg.range==='mid'){ lo1=6;hi1=9; lo2=6;hi2=9; }
  else if(cfg.range==='table'){
    lo1=cfg.table; hi1=cfg.table; lo2=1; hi2=9;
  }
  for(let a=lo1;a<=hi1;a++) for(let b=lo2;b<=hi2;b++) pool.push({a,b});
  return pool;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function makeQuestions(n, pool){
  const base = pool && pool.length ? pool : buildPool();
  const out = [];
  let bag = [];
  while(out.length < n){
    if(bag.length===0) bag = shuffle(base);
    out.push(Object.assign({}, bag.pop()));
  }
  // 避免连续两题完全相同
  for(let i=1;i<out.length;i++){
    if(out[i].a===out[i-1].a && out[i].b===out[i-1].b && base.length>1){
      const t = out[i]; out[i] = out[(i+3)%out.length]; out[(i+3)%out.length] = t;
    }
  }
  return out;
}

/* ============ 首页 UI ============ */
function renderHome(){
  // 题量
  const counts = [10,15,20,30,40,50,60,80];
  $('#chipsCount').innerHTML = counts.map(n =>
    `<div class="chip ${cfg.count===n?'on':''}" data-count="${n}"><div class="n">${n}</div><div class="u">题</div></div>`
  ).join('');
  $$('#chipsCount .chip').forEach(el=>{
    el.onclick = ()=>{ cfg.count = +el.dataset.count; renderHome(); };
  });

  // 范围
  $$('#segRange .seg-item').forEach(el=>{
    el.classList.toggle('on', el.dataset.range===cfg.range);
    el.onclick = ()=>{ cfg.range = el.dataset.range; renderHome(); };
  });
  const tBox = $('#chipsTable');
  if(cfg.range==='table'){
    tBox.style.display='grid';
    tBox.innerHTML = Array.from({length:9},(_,i)=>i+1).map(t=>
      `<div class="chip ${cfg.table===t?'on':''}" style="padding:9px 2px;border-radius:11px" data-t="${t}"><div class="n" style="font-size:16px">${t}</div></div>`
    ).join('');
    $$('#chipsTable .chip').forEach(el=>{
      el.onclick = ()=>{ cfg.table = +el.dataset.t; renderHome(); };
    });
  } else tBox.style.display='none';

  // 计时
  $$('#segMode .seg-item').forEach(el=>{
    el.classList.toggle('on', el.dataset.mode===cfg.mode);
    el.onclick = ()=>{ cfg.mode = el.dataset.mode; renderHome(); };
  });
  const lBox = $('#segLimit');
  lBox.style.display = cfg.mode==='countdown' ? 'grid' : 'none';
  $$('#segLimit .seg-item').forEach(el=>{
    el.classList.toggle('on', +el.dataset.limit===cfg.limit);
    el.onclick = ()=>{ cfg.limit = +el.dataset.limit; renderHome(); };
  });

  // 预览
  const rangeTxt = {all:'全部 1~9', easy:'入门 1~5', mid:'进阶 6~9', table:`${cfg.table} 的乘法`}[cfg.range];

  // 最近成绩
  const hist = Store.read();
  const rl = $('#recentList');
  if(!hist.length){
    rl.innerHTML = '<div class="empty-tip" style="width:100%">还没有记录，开始第一次练习吧 ~</div>';
  }else{
    rl.innerHTML = hist.slice(0,8).map(h=>{
      const rate = h.total? Math.round(h.right/h.total*100):0;
      return `<div class="rc"><b>${rate}%</b>${h.right}/${h.total} 题</div>`;
    }).join('');
  }
  Store.saveCfg(cfg);
}

/* ============ 计时 ============ */
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function startTimer(){
  stopTimer();
  S.startAt = Date.now();
  const tb = $('#timerBox');
  tb.classList.remove('warn');
  if(cfg.mode==='none'){ tb.classList.add('hide'); return; }
  tb.classList.remove('hide');
  tick();
  S.timerId = setInterval(tick, 250);
}
function tick(){
  const passed = (Date.now()-S.startAt)/1000;
  if(cfg.mode==='countdown'){
    const left = cfg.limit - passed;
    $('#timerText').textContent = fmt(Math.max(0,left));
    if(left<=10) $('#timerBox').classList.add('warn');
    if(left<=0){
      stopTimer();
      S.elapsed = cfg.limit;
      timeUp();
    }
  }else{
    $('#timerText').textContent = fmt(passed);
  }
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } }

function timeUp(){
  S.locked = true;
  const answered = S.answers.length;
  const total = S.questions.length;
  // 剩余题目标记为未作答（不计入错题池，但计入统计）
  for(let i=S.answers.length;i<total;i++){
    const q = S.questions[i];
    S.answers.push({a:q.a,b:q.b,val:null,correct:false,t:null,skip:true});
  }
  $('#ovTimeoutTxt').textContent = `共 ${total} 题，你完成了 ${answered} 题`;
  $('#ovTimeout').classList.add('show');
}

/* ============ 做题流程 ============ */
function startQuiz(questions, isRedo){
  S.questions = questions;
  S.idx = 0; S.input=''; S.answers=[]; S.locked=false; S.isRedo=!!isRedo;
  S.elapsed = 0; S.timeoutFlag=false;
  $('#correctLine').classList.remove('show');
  showScreen('screen-quiz');
  renderQ();
  startTimer();
}
function renderQ(){
  const q = S.questions[S.idx];
  const total = S.questions.length;
  $('#qNum').textContent = '第 ' + (S.idx+1) + ' 题';
  $('#qA').textContent = q.a;
  $('#qB').textContent = q.b;
  $('#qCount').textContent = (S.idx+1) + '/' + total;
  $('#progressBar').style.width = ((S.idx)/total*100) + '%';
  $('#qAns').className = 'ans';
  $('#qAns').textContent = '';
  $('#correctLine').classList.remove('show');
  S.input = '';
  S.locked = false;
  S.qStartAt = Date.now();
}

function inputKey(k){
  if(S.locked) return;
  const box = $('#qAns');
  if(k==='del'){
    S.input = S.input.slice(0,-1);
  }else if(k==='ok'){
    submit();
    return;
  }else{
    if(S.input.length>=3) return;
    if(S.input==='' && k==='0') return; // 不允许前置0
    S.input += k;
  }
  box.textContent = S.input;
  box.className = 'ans' + (S.input?' filled':'');
}

function submit(){
  if(S.locked) return;
  if(S.input===''){ toast('先输入答案哦 ~'); return; }
  const q = S.questions[S.idx];
  const val = parseInt(S.input,10);
  const correct = val === q.a*q.b;
  const t = (Date.now() - S.qStartAt)/1000;
  S.locked = true;
  const box = $('#qAns');
  S.answers.push({a:q.a,b:q.b,val,correct,t});

  if(correct){
    box.className = 'ans right';
    starBurst();
    beep(true);
    setTimeout(nextQ, 420);
  }else{
    box.className = 'ans wrong shake';
    beep(false);
    $('#correctLine').textContent = `${q.a} × ${q.b} = ${q.a*q.b}`;
    $('#correctLine').classList.add('show');
    setTimeout(nextQ, 1250);
  }
}

function nextQ(){
  S.idx++;
  if(S.idx >= S.questions.length){ finish(); return; }
  renderQ();
}

function finish(){
  stopTimer();
  S.endAt = Date.now();
  S.elapsed = S.elapsed || (S.endAt - S.startAt)/1000;
  showResult();
}

/* ============ 结算 ============ */
function showResult(){
  const total = S.answers.length;
  const right = S.answers.filter(x=>x.correct).length;
  const wrongArr = S.answers.filter(x=>!x.correct);
  const rate = total? Math.round(right/total*100) : 0;
  const used = Math.min(S.elapsed, cfg.mode==='countdown'? cfg.limit : 99999);

  $('#rTotal').textContent = total;
  $('#rRight').textContent = right;
  $('#rWrong').textContent = wrongArr.length;
  $('#rRate').textContent = rate + '%';
  $('#rTime').textContent = Math.round(used) + 's';
  $('#rAvg').textContent = total? (used/total).toFixed(1) + 's' : '0s';

  // 星级
  let stars = 0;
  if(rate>=100) stars=3; else if(rate>=90) stars=3; else if(rate>=75) stars=2; else if(rate>=50) stars=1;
  if(total>0 && right===total) stars=3;

  const hero = rate===100?'🏆': rate>=80?'🎉': rate>=60?'💪':'🌱';
  const title = rate===100?'完美通关！': rate>=80?'表现很棒！': rate>=60?'继续加油～':'多练几遍就会啦';
  const subPool = rate===100?['一道题都没错，太厉害了！','乘法小神童就是你 🥇','全对！给你一百个赞']
                  : rate>=80?['只差一点点就满分啦','再细心一点就完美了']
                  : rate>=60?['错题重做一遍，记得更牢','速度不错，正确率还能再提一提']
                  : ['错题重做是个好办法','慢慢来，每天进步一点点'];
  $('#rHero').textContent = hero;
  $('#rTitle').textContent = title;
  $('#rSub').textContent = subPool[rnd(subPool.length)];

  const starEls = $('#rStars').children;
  for(let i=0;i<3;i++){
    starEls[i].classList.remove('on');
    if(i<stars){ setTimeout(()=>{ starEls[i].classList.add('on'); playDing(i); }, 220 + i*220); }
  }

  // 错题
  const wl = $('#wrongList');
  if(wrongArr.length){
    wl.style.display='block';
    $('#wrongTag').textContent = wrongArr.length + ' 题';
    $('#wrongItems').innerHTML = wrongArr.map(w=>{
      const mine = w.val===null || w.val===undefined ? '未作答' : w.val;
      return `<div class="wrong-item"><span>${w.a} × ${w.b} =</span><span class="x">${mine}</span><span class="arrow">→</span><span class="ok">${w.a*w.b}</span></div>`;
    }).join('');
    $('#btnRedoWrong').style.display='block';
    $('#redoN').textContent = wrongArr.length;
    S.redoPool = wrongArr.map(w=>({a:w.a,b:w.b}));
  }else{
    wl.style.display='none';
    $('#btnRedoWrong').style.display='none';
    S.redoPool = [];
  }

  // 存历史
  if(!S.isRedo || true){
    Store.add({
      ts: Date.now(),
      total, right, wrong: wrongArr.length, rate,
      time: Math.round(used),
      range: cfg.range, count: total, mode: cfg.mode,
      stars
    });
  }

  showScreen('screen-result');
  if(rate===100 || stars===3) confettiRain();
}

/* ============ 星星/音效 ============ */
function starBurst(){
  const main = $('#qMain');
  const el = document.createElement('div');
  el.className='star-fly';
  el.textContent = ['⭐','✨','🌟','💫'][rnd(4)];
  el.style.marginLeft = (rnd(60)-30) + 'px';
  main.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
let actx=null;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function beep(ok){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type='sine';
  if(ok){ o.frequency.setValueAtTime(880,c.currentTime); o.frequency.setValueAtTime(1320,c.currentTime+0.08); }
  else { o.frequency.setValueAtTime(300,c.currentTime); o.frequency.setValueAtTime(200,c.currentTime+0.1); }
  g.gain.setValueAtTime(0.08,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.22);
  o.start(); o.stop(c.currentTime+0.24);
}
function playDing(i){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination); o.type='triangle';
  o.frequency.setValueAtTime([660,880,1100][i]||880, c.currentTime);
  g.gain.setValueAtTime(0.09,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);
  o.start(); o.stop(c.currentTime+0.36);
}
function confettiRain(){
  const box = $('#confetti');
  const chars = ['⭐','✨','🌟','💛','💜','🎉','💫'];
  for(let i=0;i<26;i++){
    const d = document.createElement('div');
    d.textContent = chars[rnd(chars.length)];
    d.style.cssText = `position:absolute;top:-40px;left:${rnd(100)}%;font-size:${14+rnd(16)}px;
      animation:fall ${1.6+Math.random()*1.4}s linear ${Math.random()*0.7}s forwards;`;
    box.appendChild(d);
    setTimeout(()=>d.remove(), 3800);
  }
  if(!document.getElementById('fallKf')){
    const st = document.createElement('style'); st.id='fallKf';
    st.textContent = '@keyframes fall{to{transform:translateY(110vh) rotate(420deg);opacity:.1}}';
    document.head.appendChild(st);
  }
}

/* ============ 提示 ============ */
let toastT=null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1500);
}

/* ============ 屏幕切换 ============ */
function showScreen(id){
  window.scrollTo(0,0);
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active');
}

/* ============ 历史页 ============ */
function renderHistory(){
  const list = Store.read();
  const box = $('#histList');
  if(!list.length){
    box.innerHTML = '<div class="empty-tip" style="padding:50px 0">还没有练习记录</div>';
    return;
  }
  box.innerHTML = list.map(h=>{
    const d = new Date(h.ts);
    const dateStr = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const color = h.rate>=90?'linear-gradient(140deg,#5FD99B,#22B573)': h.rate>=60?'linear-gradient(140deg,#FFC46B,#FFA94D)':'linear-gradient(140deg,#FF8A97,#FF4757)';
    const rangeTxt = {all:'全部', easy:'入门', mid:'进阶', table:'单表'}[h.range]||'全部';
    return `<div class="hist-item">
      <div class="hist-badge" style="background:${color}">${h.rate}%<small>正确率</small></div>
      <div class="hist-info">
        <div class="l1">${h.right}/${h.total} 题 · ${rangeTxt}${h.mode==='countdown'?' · 限时':' · 计时'}</div>
        <div class="l2">${dateStr} · 用时 ${h.time}s</div>
      </div>
      <div style="font-size:16px">${'⭐'.repeat(h.stars||0)||'—'}</div>
    </div>`;
  }).join('');
}

/* ============ 事件绑定 ============ */
// 开始
$('#btnStart').onclick = ()=>{
  ac();
  const pool = buildPool();
  const qs = makeQuestions(cfg.count, pool);
  startQuiz(qs, false);
};
$('#btnHistory').onclick = ()=>{ renderHistory(); showScreen('screen-history'); };
$('#btnHistBack').onclick = ()=> showScreen('screen-home');
$('#btnHistClear').onclick = ()=>{
  if(confirm('确定清空全部练习记录吗？')){
    Store.clear(); renderHistory(); renderHome(); toast('已清空记录');
  }
};

// 键盘输入
$('#pad').addEventListener('click', e=>{
  const btn = e.target.closest('.key');
  if(!btn) return;
  ac();
  inputKey(btn.dataset.k);
});
// 物理键盘（电脑端方便测试）
document.addEventListener('keydown', e=>{
  if(!$('#screen-quiz').classList.contains('active')) return;
  if(/^[0-9]$/.test(e.key)) inputKey(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); inputKey('del'); }
  else if(e.key==='Enter'){ inputKey('ok'); }
});

// 退出
$('#btnQuit').onclick = ()=>{ $('#ovQuit').classList.add('show'); };
$('#ovQuitNo').onclick = ()=> $('#ovQuit').classList.remove('show');
$('#ovQuitYes').onclick = ()=>{
  $('#ovQuit').classList.remove('show');
  stopTimer();
  renderHome();
  showScreen('screen-home');
};
$('#ovTimeoutOk').onclick = ()=>{
  $('#ovTimeout').classList.remove('show');
  showResult();
};

// 结算按钮
$('#btnRedoWrong').onclick = ()=>{
  if(!S.redoPool.length) return;
  const qs = shuffle(S.redoPool);
  startQuiz(qs, true);
};
$('#btnAgain').onclick = ()=>{
  const qs = makeQuestions(cfg.count, buildPool());
  startQuiz(qs, false);
};
$('#btnBackHome').onclick = ()=>{ renderHome(); showScreen('screen-home'); };

// 初始化
renderHome();

// 防止微信下拉回弹
document.addEventListener('touchmove', function(e){
  const scroller = e.target.closest('.result-wrap,.hist-wrap');
  if(!scroller) { if(e.target.closest('#app')) e.preventDefault(); }
}, {passive:false});

// 微信内自动播放音频需要用户交互，第一次点击唤醒
document.addEventListener('touchstart', function once(){ ac(); document.removeEventListener('touchstart', once); }, {passive:true});

})();
</script>
</body>
</html>
